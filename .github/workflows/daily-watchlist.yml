name: Daily stock watchlist

on:
  schedule:
    # Multiple attempts make the mail resilient to delayed or dropped scheduled runs.
    # The Python script only sends once per Copenhagen date and only before market open.
    - cron: '37 4-15 * * 1-5'
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-watchlist
  cancel-in-progress: false
  queue: max

jobs:
  send-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh default branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show schedule context
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc_now=$(date -u)"

      - name: Check email secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          missing=0
          for name in SMTP_USER SMTP_PASSWORD EMAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is missing. Open Settings -> Secrets and variables -> Actions -> Repository secrets, then create this exact name."
              missing=1
            else
              echo "$name is configured."
            fi
          done
          exit "$missing"

      - name: Send Danish stock watchlist
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python src/watchlist.py --force
          else
            python src/watchlist.py
          fi

      - name: Commit sent-date marker
        run: |
          if [ -z "$(git status --porcelain -- .watchlist-state/last_sent_date.txt)" ]; then
            echo "No sent-date marker changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .watchlist-state/last_sent_date.txt
          git commit -m "Record watchlist sent date [skip ci]"
          git pull --rebase origin main
          git push
